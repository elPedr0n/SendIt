<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D37A}a:hover{color:#4ADE95}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(circle at 50% 30%, rgba(242, 194, 48, 0.20) 0%, rgba(242, 194, 48, 0.06) 32%, #0A0D12 62%); color: #F1F5F9; font-family: Outfit, system-ui, sans-serif; padding: 56px 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 22px">
  <div style="width: 100%; display: flex; justify-content: flex-end">
    <button type="button" aria-label="Fechar" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #151B23; color: #C9D1DC; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 6px; color: #F2C230">LEVEL UP</span>

  <div style="width: 176px; height: 176px; border-radius: 48px; background: linear-gradient(135deg, #FFF0B3 0%, #F2C230 38%, #B8860B 70%, #FFE27A 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #3A2A00; box-shadow: 0 0 0 8px rgba(242, 194, 48, 0.14), 0 24px 60px rgba(242, 194, 48, 0.28)">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 13.8L7 22l5-3 5 3-1.5-8.2"></path></svg>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 1px">OURO</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600">
    <span style="padding: 6px 12px; border-radius: 999px; background: #1E2530; color: #C7CED8">Prata</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA4B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    <span style="padding: 6px 12px; border-radius: 999px; background: #2E2508; color: #F2C230">Ouro</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 48px; line-height: 1">Supino reto</h1>
    <p style="margin: 0; font-size: 15px; color: #9AA4B2">Sua série de 80 kg × 5 levou o 1RM estimado a 92 kg.</p>
  </div>

  <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #151B23; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; letter-spacing: 2.2px; color: #9AA4B2">1RM ESTIMADO</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; line-height: 1">92 <span style="font-size: 16px; color: #9AA4B2">kg</span></span>
    </div>
    <div style="background: #151B23; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; letter-spacing: 2.2px; color: #9AA4B2">TEMPO EM PRATA</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; line-height: 1">23 <span style="font-size: 16px; color: #9AA4B2">dias</span></span>
    </div>
  </div>

  <div style="width: 100%; box-sizing: border-box; background: #151B23; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 14px">
      <span style="color: #9AA4B2">Próximo: <span style="color: #7FD6CF; font-weight: 600">Platina</span></span>
      <span style="color: #F1F5F9; font-weight: 600">faltam 8 kg</span>
    </div>
    <div style="height: 8px; border-radius: 4px; background: #1E2530"><div style="width: 6%; height: 8px; border-radius: 4px; background: #7FD6CF"></div></div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="width: 100%; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 60px; border: none; border-radius: 18px; background: #22D37A; color: #062814; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1.5px; cursor: pointer">CONTINUAR</button>
    <button type="button" style="height: 48px; border: none; border-radius: 16px; background: transparent; color: #C9D1DC; font-size: 15px; font-weight: 600; cursor: pointer">Compartilhar conquista</button>
  </div>
</div>
</x-dc>
