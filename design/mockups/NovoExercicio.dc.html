<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novo exercício</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22D37A}a:hover{color:#4ADE95}
button{font-family:inherit}
input::placeholder{color:#8B95A5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0D12; color: #F1F5F9; font-family: Outfit, system-ui, sans-serif; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Fechar" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #151B23; color: #C9D1DC; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <span style="font-size: 11px; font-weight: 500; letter-spacing: 2.4px; color: #9AA4B2">PERSONALIZADO</span>
    <div style="width: 44px"></div>
  </div>

  <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1">Novo exercício</h1>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="nome-ex" style="font-size: 11px; font-weight: 500; letter-spacing: 2.4px; color: #9AA4B2">NOME</label>
    <input id="nome-ex" type="text" placeholder="Ex.: Leg press 45°" style="height: 54px; padding: 0 16px; border: none; border-radius: 16px; background: #151B23; color: #F1F5F9; font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600; outline: none">
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 500; letter-spacing: 2.4px; color: #9AA4B2">CATEGORIA</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="8">
        <button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 500; letter-spacing: 2.4px; color: #9AA4B2">COMO REGISTRAR</span>
    <div role="radiogroup" aria-label="Tipo de registro" style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ types }}" as="t" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{ t.pressed }}" onClick="{{ t.pick }}" style="{{ t.style }}">
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; text-align: left">
            <span style="font-size: 16px; font-weight: 600; color: #F1F5F9">{{ t.label }}</span>
            <span style="font-size: 13px; color: #9AA4B2">{{ t.hint }}</span>
          </div>
          <div style="{{ t.dot }}"></div>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <button type="button" style="height: 60px; border: none; border-radius: 18px; background: #22D37A; color: #062814; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1.5px; cursor: pointer">CRIAR EXERCÍCIO</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Pernas', type: 'reps_weight' };
  }
  renderVals() {
    const s = this.state;
    const cats = ['Peito', 'Costas', 'Pernas', 'Ombros', 'Braços', 'Core', 'Escalada', 'Cardio'].map((label) => {
      const on = label === s.cat;
      return {
        label: label,
        pressed: on ? 'true' : 'false',
        style: 'height: 42px; padding: 0 16px; border-radius: 21px; cursor: pointer; font-size: 15px; font-weight: 600; ' +
          (on ? 'border: none; background: #22D37A; color: #062814;' : 'border: 1px solid #2E3744; background: transparent; color: #C9D1DC;'),
        pick: () => this.setState({ cat: label })
      };
    });
    const types = [
      { id: 'reps_weight', label: 'Reps + peso', hint: 'Séries, repetições e kg · conta para 1RM e PR' },
      { id: 'time', label: 'Tempo', hint: 'Prancha, escalada, alongamento' },
      { id: 'distance', label: 'Distância', hint: 'Corrida, remo, natação' }
    ].map((t) => {
      const on = t.id === s.type;
      return {
        label: t.label,
        hint: t.hint,
        pressed: on ? 'true' : 'false',
        style: 'min-height: 68px; padding: 12px 16px; border-radius: 18px; cursor: pointer; display: flex; align-items: center; gap: 12px; ' +
          (on ? 'border: 1.5px solid #22D37A; background: #10301F;' : 'border: 1.5px solid transparent; background: #151B23;'),
        dot: 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; flex-shrink: 0; ' +
          (on ? 'border: 7px solid #22D37A; background: #0A0D12;' : 'border: 2px solid #4A5563;'),
        pick: () => this.setState({ type: t.id })
      };
    });
    return { cats: cats, types: types };
  }
}
</script>
</body>
</html>
